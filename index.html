<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e0c">
<title>Скоро открытие</title>

<style>
:root {
    --bg: #0b0e0c;
    --panel: rgba(17, 22, 18, 0.88);
    --text: #edf4ee;
    --muted: #89968b;
    --green: #a3e635;
    --line: rgba(194, 214, 194, 0.12);
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    padding: 20px;
    background:
        radial-gradient(ellipse at 50% 42%, rgba(91, 138, 54, 0.13), transparent 42%),
        linear-gradient(rgba(163,230,53,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(163,230,53,.025) 1px, transparent 1px),
        var(--bg);
    background-size: auto, 42px 42px, 42px 42px, auto;
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
}

.frame {
    position: relative;
    width: min(100%, 760px);
    padding: clamp(24px, 5vw, 54px);
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: var(--panel);
    box-shadow: 0 28px 100px rgba(0,0,0,.42),
                0 0 70px rgba(126,190,54,.055);
    backdrop-filter: blur(16px);
}

.frame::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
}

.topbar, .footer, .status, .eyebrow, .prompt {
    font-family: monospace;
}

.topbar, .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .04em;
}

.brand {
    color: #dce8dc;
}

.brand-mark {
    color: var(--green);
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px rgba(163,230,53,.8);
}

.content {
    padding: clamp(42px, 8vh, 78px) 0 clamp(34px, 7vh, 64px);
}

.eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    color: var(--green);
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
}

.eyebrow::before {
    content: "";
    width: 22px;
    height: 1px;
    background: var(--green);
}

h1 {
    max-width: 620px;
    margin: 0;
    font-size: clamp(34px, 6.8vw, 62px);
    line-height: 1.04;
    letter-spacing: -.055em;
    font-weight: 650;
}

.accent {
    color: var(--green);
}

.description {
    max-width: 510px;
    margin: 22px 0 0;
    color: #a9b5aa;
    font-size: 15px;
    line-height: 1.75;
}

.action-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 34px;
}

.action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 48px;
    padding: 0 19px;
    border: 1px solid rgba(163,230,53,.55);
    border-radius: 9px;
    background: var(--green);
    color: #11170b;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: .16s ease;
}

.action:hover {
    transform: translateY(-2px);
    background: #b8f35a;
    box-shadow: 0 8px 28px rgba(163,230,53,.18);
}

.action:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 4px;
}

.action-arrow {
    font-size: 17px;
}

.prompt {
    color: #748176;
    font-size: 11px;
}

.prompt span {
    color: var(--green);
}

.footer {
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
}

@media (max-width: 520px) {
    .frame {
        border-radius: 16px;
    }

    .content {
        padding: 48px 0 42px;
    }

    .topbar, .footer {
        font-size: 10px;
    }

    .footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
    }

    .action-row {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-height: 620px) {
    .content {
        padding: 25px 0;
    }
}
</style>
</head>

<body>

<main class="frame">

    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">●</span>
            <span id="brand"></span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="status"></span>
        </div>
    </header>

    <section class="content">

        <div class="eyebrow" id="eyebrow"></div>

        <h1 id="headline"></h1>

        <p class="description" id="description"></p>

        <div class="action-row">

            <a class="action" id="action" href="#">
                <span id="buttonText"></span>
                <span class="action-arrow">↗</span>
            </a>

            <span class="prompt">
                <span>user@linux</span>:~$ ./stay_tuned
            </span>

        </div>

    </section>

    <footer class="footer">
        <span id="footerLeft"></span>
        <span id="footerRight"></span>
    </footer>

</main>

<script>

/* =====================================
   НАСТРОЙКИ САЙТА
   МЕНЯЙ ТЕКСТ И ССЫЛКИ ЗДЕСЬ
===================================== */

const CONFIG = {

    pageTitle: "Скоро открытие",

    brand: "~/my-site",

    status: "IN DEVELOPMENT",

    eyebrow: "SYSTEM MESSAGE",

    headline: 'Скоро здесь<br><span class="accent">будет что-то интересное.</span>',

    description: "Я работаю над сайтом. Загляни сюда немного позже — скоро здесь появится кое-что новое.",

    buttonText: "Открыть History AI",

    buttonUrl: "./history-ai/index.html",

    footerLeft: "© 2026 · YOUR NAME",

    footerRight: "BUILT WITH A LINUX MINDSET"

};

/* =====================================
   НЕ НУЖНО МЕНЯТЬ КОД НИЖЕ
===================================== */

document.title = CONFIG.pageTitle;

document.getElementById("brand").textContent = CONFIG.brand;

document.getElementById("status").textContent = CONFIG.status;

document.getElementById("eyebrow").textContent = CONFIG.eyebrow;

document.getElementById("headline").innerHTML = CONFIG.headline;

document.getElementById("description").textContent = CONFIG.description;

document.getElementById("buttonText").textContent = CONFIG.buttonText;

document.getElementById("action").href = CONFIG.buttonUrl;

document.getElementById("footerLeft").textContent = CONFIG.footerLeft;

document.getElementById("footerRight").textContent = CONFIG.footerRight;

</script>

</body>
</html>
