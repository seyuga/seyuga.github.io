tes(state.map,size,zoom)}else{ctx.strokeStyle='#253844';ctx.lineWidth=1/zoom;for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(i*size/10,0);ctx.lineTo(i*size/10,size);ctx.moveTo(0,i*size/10);ctx.lineTo(size,i*size/10);ctx.stroke()}}if(state.bomb?.position){const [bx,by]=pos(state.bomb.position);drawBomb(bx,by,state.bomb,me.team,zoom)}if(groundWeaponsVisible&&Array.isArray(state.weapons)){for(const item of state.weapons){if(!Array.isArray(item.position)||item.position.length<2)continue;const [wx,wy]=pos(item.position);drawGroundWeapon(wx,wy,item,zoom)}}const prior=new Map(old?.players.map(p=>[p.id,p])||[]);for(const p of state.players){const player=interpolate(p,prior.get(p.id)),enemy=player.team!==me.team;if(enemy&&!enemiesVisible||!enemy&&!alliesVisible)continue;const [x,y]=pos(player.position);playerHits.push({id:player.id,x:size/2+zoom*(x-center[0]),y:canvas.clientHeight/2+zoom*(y-center[1])});marker(x,y,player,false,zoom,me.team);const parts=[];if(names)parts.push(player.name);if(health&&enemy)parts.push(player.hp+' HP');drawLabel(parts,x,y,zoom,player.team);if(playerWeaponsVisible&&player.weapon)drawPlayerWeapon(player,x,y,zoom)}if(me.alive!==false){playerHits.push({id:null,x:size/2+zoom*(local[0]-center[0]),y:canvas.clientHeight/2+zoom*(local[1]-center[1])});marker(local[0],local[1],me,true,zoom,me.team);if(playerWeaponsVisible&&me.weapon)drawPlayerWeapon(me,local[0],local[1],zoom)}updatePlayerIsland();ctx.restore();if(!ready&&mapStatus){ctx.fillStyle='#ffca84';ctx.font='12px "Unbounded",system-ui,sans-serif';ctx.fillText(mapStatus,12,44)}}
function updatePlayerIsland(){const box=$('player-island');if(selectedPlayer===null){box.hidden=true;return}const p=state?.players?.find(v=>v.id===selectedPlayer);if(!p){selectedPlayer=null;box.hidden=true;return}box.hidden=false;$('view-name').textContent=p.name||'Игрок';$('view-name').style.color=p.team===3?'#6ba5ff':'#f3a949';$('view-hp').textContent=p.hp+' HP';$('view-armor').textContent=p.armor==null?'Броня: —':'Броня: '+p.armor;const weapon=$('view-weapon');weapon.textContent=p.weapon||'';weapon.hidden=!playerWeaponsVisible||!p.weapon}
