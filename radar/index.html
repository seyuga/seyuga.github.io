<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>CS2 · Cloud Radar</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#e9eef8;font:15px system-ui}header,footer,.controls{max-width:900px;margin:auto;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header strong{font-size:21px}#map{color:#8a9bb5}#status{margin-left:auto;color:#ffcc77;font-size:13px}.stage{position:relative;max-width:900px;margin:auto;aspect-ratio:1;background:#101925;border:1px solid #223249;border-radius:18px;overflow:hidden}canvas{width:100%;height:100%;display:block}.controls button{background:#1b2b40;color:#d9e8ff;border:1px solid #334862;border-radius:9px;padding:11px 15px;cursor:pointer}.controls button.active{background:#236a58}footer{font-size:13px;color:#91a3bc}#message{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:25px;background:#0b1018dd;pointer-events:none}#message:empty{display:none}.red{color:#ff666b}.blue{color:#62b8ff}.green{color:#5be1aa}#counts{margin-left:auto}@media(max-width:600px){header{padding:14px}header strong{font-size:18px}.stage{border-radius:0}footer{padding:12px}.controls{padding:10px;gap:8px}.controls button{padding:10px}}</style>
<header><strong>◉ CLOUD RADAR</strong><span id="map">CS2</span><span id="status">Подключение…</span></header><form id="connection" style="max-width:900px;margin:10px auto;padding:14px;display:none"><label>Ссылка канала данных <input id="endpoint" type="url" required placeholder="https://…/секретный-адрес/" style="width:100%;padding:12px;margin:8px 0;background:#152238;color:white;border:1px solid #456;border-radius:8px"></label><button style="padding:10px">Подключиться</button><p style="color:#91a3bc;font-size:13px">Вставь ссылку из файла «Ссылка.txt» на игровом ПК. Не публикуй её. Игровой ПК и сервер радара должны работать.</p></form><div class="stage"><canvas id="canvas"></canvas><div id="message">Подключение к компьютеру…</div></div><div class="controls"><button id="minus">− Масштаб</button><button id="plus">+ Масштаб</button><button id="center">Вся карта</button><button id="floor" hidden>Нижний этаж</button><button id="names">Имена</button><button id="copy">Скопировать ссылку</button><span id="counts"></span><button id="settings" type="button">Подключение</button></div><footer><span style="color:#ff4545">◆ КТ</span><span style="color:#ffdc59">● Т</span><span>Белая обводка — ты · стрелки — взгляд</span><span>↑ выше тебя · ↓ ниже тебя. Фон карты из CS2. Двойное касание — вся карта.</span></footer>

<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let state=null,previous=null,last=0,zoom=1,names=true,meta=null,image=null,loadingMap='',lower=false;
const hosted=/^\/radar(?:\/|$)/.test(location.pathname);let base=location.pathname.replace(/\/$/,'');
let transport='http',socket=null,socketBase='',retryAt=0;
const modeControl=document.createElement('select');modeControl.id='transport';modeControl.innerHTML='<option value="http">Обычная ссылка</option><option value="ws">Постоянный канал Cloudflare</option>';$('connection').insertBefore(modeControl,$('connection').querySelector('button'));
function endpoint(value){const u=new URL(value);if(u.protocol!=='https:'&&u.hostname!=='127.0.0.1'&&u.hostname!=='localhost')throw Error('Нужна HTTPS-ссылка');return u.origin+u.pathname.replace(/\/$/,'')}
if(hosted){try{const options=new URLSearchParams(location.hash.slice(1)),supplied=options.get('connect');base=endpoint(supplied||localStorage.getItem('cloudRadarEndpoint')||'');transport=(supplied?options.get('mode'):localStorage.getItem('cloudRadarMode'))==='ws'?'ws':'http';if(supplied){localStorage.setItem('cloudRadarEndpoint',base);localStorage.setItem('cloudRadarMode',transport)}}catch(e){base=''}}
modeControl.value=transport;
$('connection').style.display=hosted&&!base?'block':'none';$('endpoint').value=hosted?base:'';
$('settings').onclick=()=>{$('connection').style.display=$('connection').style.display==='none'?'block':'none'};
$('connection').onsubmit=e=>{e.preventDefault();try{base=endpoint($('endpoint').value);transport=modeControl.value;localStorage.setItem('cloudRadarEndpoint',base);localStorage.setItem('cloudRadarMode',transport);if(hosted)location.hash='connect='+encodeURIComponent(base)+'&mode='+transport;if(socket)socket.close();socket=null;socketBase='';retryAt=0;state=null;previous=null;loadingMap='';meta=null;image=null;$('connection').style.display='none'}catch(error){alert(error.message)}};
$('names').classList.add('active');
$('minus').onclick=()=>zoom=Math.max(1,zoom/1.4);$('plus').onclick=()=>zoom=Math.min(8,zoom*1.4);$('center').onclick=()=>zoom=1;canvas.ondblclick=()=>zoom=1;
$('names').onclick=()=>{names=!names;$('names').classList.toggle('active',names)};
$('floor').onclick=()=>{lower=!lower;$('floor').textContent=lower?'Верхний этаж':'Нижний этаж';setImage()};
$('copy').onclick=async()=>{const link=hosted?location.origin+location.pathname+'#connect='+encodeURIComponent(base)+'&mode='+transport:location.href;try{await navigator.clipboard.writeText(link);$('copy').textContent='Ссылка скопирована'}catch(e){prompt('Ссылка для телефона',link)}};
function mapBase(){return transport==='ws'?new URL(base).origin:base}
function setImage(){if(!meta)return;image=new Image();image.src=mapBase()+'/maps/'+(lower&&meta.lower?meta.lower:meta.image)}
async function loadMap(name){loadingMap=name;meta=null;image=null;lower=false;try{const r=await fetch(mapBase()+'/maps/'+encodeURIComponent(name)+'.json');if(!r.ok)throw Error('Для этой карты нет фона');const m=await r.json();if(loadingMap!==name)return;meta=m;$('floor').hidden=!m.lower;setImage()}catch(e){if(loadingMap===name)$('status').textContent='Нет изображения этой карты'}}
function acceptState(next,label){if(typeof next.ok!=='boolean'||(next.ok&&(!Array.isArray(next.players)||!next.local)))return;previous=state;state=next;last=performance.now();$('status').textContent=next.ok?'● На связи'+label:'Ожидание игры';$('status').style.color=next.ok?'#5be1aa':'#ffcc77';$('map').textContent=next.map||'CS2';$('message').textContent=next.ok?'':next.error||'Ожидание игры';$('counts').textContent=next.ok?next.players.length+' игроков':'';if(next.ok&&next.map!==loadingMap)loadMap(next.map)}
function cloudConnection(){if(socketBase!==base&&socket){socket.close();socket=null}if(socket||Date.now()<retryAt)return;socketBase=base;const ws=new WebSocket(base.replace(/^http/,'ws')+'/live');socket=ws;ws.onmessage=e=>{if(socket!==ws)return;try{acceptState(JSON.parse(e.data),' · облако')}catch{}};ws.onerror=()=>ws.close();ws.onclose=()=>{if(socket===ws){socket=null;retryAt=Date.now()+2000}}}
async function poll(){if(!base){$('message').textContent='Подключи канал данных с игрового ПК';setTimeout(poll,500);return}if(transport==='ws'){cloudConnection();if(performance.now()-last>5000){$('status').textContent='Ожидание данных';$('message').textContent='Нет свежих данных с игрового ПК. Проверь cloud-radar.'}setTimeout(poll,500);return}const start=performance.now(),requestedBase=base;try{const r=await fetch(base+'/api',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error('Нет доступа');const next=await r.json();if(base===requestedBase&&transport==='http')acceptState(next,' · '+Math.round(performance.now()-start)+' мс')}catch(e){$('status').textContent='Связь прервана';if(performance.now()-last>5000)$('message').textContent='Нет связи с компьютером. Проверь cloud-radar.'}setTimeout(poll,120)}
function marker(x,y,team,yaw,self,z){ctx.save();ctx.translate(x,y);ctx.scale(1/z,1/z);const color=team===3?'#ff4545':'#ffdc59';ctx.save();ctx.rotate((90-(yaw||0))*Math.PI/180);ctx.fillStyle=color;ctx.strokeStyle='#07101b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(-4,-8);ctx.lineTo(4,-8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();ctx.fillStyle=color;ctx.strokeStyle=self?'#ffffff':'#15212c';ctx.lineWidth=self?2.5:1.5;ctx.beginPath();if(team===3){ctx.moveTo(0,-6);ctx.lineTo(7,0);ctx.lineTo(0,6);ctx.lineTo(-7,0);ctx.closePath()}else ctx.arc(0,0,5.5,0,Math.PI*2);ctx.fill();ctx.stroke();if(self){ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function draw(){requestAnimationFrame(draw);const dpr=Math.min(devicePixelRatio||1,2),size=canvas.clientWidth;if(canvas.width!==Math.round(size*dpr))canvas.width=canvas.height=Math.round(size*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#101925';ctx.fillRect(0,0,size,size);if(!state?.ok)return;
const origin=state.local.position,ready=meta&&image?.complete&&image.naturalWidth>0;
const pos=p=>ready?[(p[0]-meta.x)/meta.scale/1024*size,(meta.y-p[1])/meta.scale/1024*size]:[(p[0]-origin[0])/5000*size+size/2,-(p[1]-origin[1])/5000*size+size/2];
const local=pos(origin),center=zoom>1?local:[size/2,size/2];ctx.save();ctx.translate(size/2,size/2);ctx.scale(zoom,zoom);ctx.translate(-center[0],-center[1]);if(ready){ctx.drawImage(image,0,0,size,size)}else{ctx.strokeStyle='#28415b';ctx.lineWidth=1/zoom;for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(i*size/10,0);ctx.lineTo(i*size/10,size);ctx.moveTo(0,i*size/10);ctx.lineTo(size,i*size/10);ctx.stroke()}}
const alpha=Math.min(1,(performance.now()-last)/100);for(const p of state.players){let point=p.position;const prior=previous?.ok&&previous.map===state.map?previous.players.find(o=>o.id===p.id):null;if(prior)point=point.map((v,i)=>prior.position[i]+(v-prior.position[i])*alpha);const [x,y]=pos(point),r=5/zoom;marker(x,y,p.team,p.yaw,false,zoom);ctx.fillStyle='white';ctx.font=(12/zoom)+'px system-ui';ctx.lineWidth=3/zoom;const z=point[2]-origin[2],label=(names?p.name+' · '+p.hp:'')+(Math.abs(z)>70?(z>0?' ↑':' ↓'):'');if(label){ctx.strokeText(label,x+8/zoom,y-8/zoom);ctx.fillText(label,x+8/zoom,y-8/zoom)}}
marker(local[0],local[1],state.local.team,state.local.yaw,true,zoom);ctx.restore();if(!ready){ctx.fillStyle='#ffcc77';ctx.font='13px system-ui';ctx.fillText(meta?'Загрузка изображения…':'Фон карты недоступен',12,24)}if(performance.now()-last>2500){ctx.fillStyle='#ffcc77';ctx.fillText('Данные устарели',12,size-15)}}
poll();draw();
</script></html>
